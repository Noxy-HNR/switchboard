# Capability overlay for the models in C:\AI\models.
#
# Everything Switchboard can read for itself - file size, configured context,
# GPU layers, chat template, whether the file still exists - comes from
# C:\AI\Config\models.json and the GGUF headers. This file adds only the two
# things a machine cannot read off disk:
#
#   1. capability ceilings: editable policy priors, NOT benchmarks.
#   2. measured speeds: real numbers with their provenance recorded.
#
# A capability ceiling is the task difficulty (same 0-3 scale the difficulty
# decision uses) at which this model has a coin-flip chance of answering well.
# Higher = trusted with harder work in that domain. Tune these by hand; the
# routing reason always names the ceiling that decided a route.
#
# Anything Switchboard measures at runtime (load seconds, tokens/sec) is stored
# in the database and overrides the seeds below. So a seed only decides routing
# for a model that has no runtime samples yet.
#
# Things that are coupled to values in this file:
#   * `role = "general-fast"` is matched literally by evals/runner.py (it picks
#     the starting model by it). Other roles are labels.
#   * A model's id is what config/local.toml `auto_exclude` (the Settings panel)
#     refers to. A model without an `id` here gets one derived from its filename.
#     Do not add or change an id on a model that is listed in auto_exclude, or
#     the exclusion silently stops applying.
#
# Speeds below were measured 2026-09-26/28 (tuning log sessions 8, 9 and 13) with
# temperature 0.2-0.7 prose prompts. gen_tps is decode speed on prose; prompt_tps
# is cold prefill of a ~2.2k-token prompt; load_s is the dashboard load call to
# "ready" with the file already cached. Every model here uses speculative decoding
# (MTP and/or n-gram), which is why gen_tps is well above a plain llama-bench run.
# A field that was never measured is left out, so Switchboard fills it from runtime.

[[model]]
file = "Qwen3.5-9B-UD-Q6_K_XL-mtp.gguf"
id = "qwen3.5-9b"
aliases = ["qwen9b", "9b", "fast"]
role = "general-fast"
summary = "Fast general model, fully GPU resident, with an MTP head plus n-gram speculation: about 85-98 tok/s on prose and 300+ tok/s on copy-heavy code edits, 131K context. The daily driver."
enabled = true
tool_calling = "good"

[model.capability]
general = 2.1
coding = 2.0
research = 1.9
medical = 1.0
writing = 2.1
system_ops = 2.0

[model.measured]
gen_tps = 85.0
gen_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 9 (2026-09-26), MTP + ngram-mod, ctx 131072, prose 83-98 tok/s over four runs"
prompt_tps = 2500.0
prompt_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 9 (2026-09-26), 2.4-2.6k tok/s on a ~2.2k-token prompt"
load_s = 19.0
load_s_source = "C:/AI/Logs/overnight-tuning-log.md, session 9 (2026-09-26), median of 10 loads, 9-24 s, file cached"

[[model]]
file = "Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_XXS-mtp.gguf"
# No `id` on purpose: the derived id is the one config/local.toml auto_exclude names.
# "27b", "qwen27b" and "deep" are how clients ask for the 27B by name (registry.resolve takes the
# first match), so they belong on the model that is the better 27B: this one.
aliases = ["huihui", "qwen27b", "27b", "deep", "27b-mtp", "27b-fast"]
role = "deep-reasoning"
summary = "Strongest general reasoning available locally, and fully GPU resident (10.4 GB IQ3_XXS with an MTP head plus n-gram speculation): about 50 tok/s, roughly 2.5x the older 27B, but only a 24K context. Abliterated Qwen3.8-27B fine-tune."
enabled = true
tool_calling = "good"
# Same Qwen3.8-27B base as the older 27B below, so the same ceilings. Its perplexity on the
# local corpus is about 5% higher (10.72 vs 10.21, within the error bars) and the fine-tune
# differs, so there is no measured basis to rate it higher or lower.

[model.capability]
general = 2.6
coding = 2.5
research = 2.5
medical = 1.6
writing = 2.5
system_ops = 2.4

[model.measured]
gen_tps = 49.0
gen_tps_source = "C:/AI/Logs/overnight-tuning-log.md, sessions 7-8 (2026-09-25/26), MTP + ngram-mod, ctx 24576, prose 48.6-53.1 tok/s"
prompt_tps = 900.0
prompt_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 8 (2026-09-26), 900-925 tok/s on a ~2.2k-token prompt"
load_s = 22.0
load_s_source = "C:/AI/Logs/overnight-tuning-log.md, session 8 (2026-09-26), median of 16 loads, 11-27 s, file cached"

[[model]]
file = "medgemma-27b-it-Q4_K_M.gguf"
id = "medgemma-27b"
aliases = ["medgemma", "medical"]
role = "medical-specialist"
summary = "Medical/clinical specialist (Gemma-3 based). 16.5 GB Q4_K_M with 37 of 62 layers on the GPU: about 7 tok/s, 40K context, and about 9x faster on copy-heavy work with n-gram speculation. The slowest model here, and its file exceeds total system RAM."
enabled = true
# Gemma-3 based: its chat template has no tool-call support. Verified from the
# GGUF chat template at registry build time; this is the fallback assumption.
tool_calling = "none"

[model.capability]
general = 1.9
coding = 1.2
research = 1.8
medical = 2.8
writing = 1.9
system_ops = 1.0

[model.measured]
gen_tps = 7.3
gen_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 8 (2026-09-26), ngl 37, ctx 40960, prose 7.2-7.6 tok/s"
prompt_tps = 285.0
prompt_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 8 (2026-09-26), 255-300 tok/s on a ~2.2k-token prompt (was 77-164 while RAM was scarce)"
load_s = 19.0
load_s_source = "C:/AI/Logs/overnight-tuning-log.md, session 8 (2026-09-26), median of 13 loads, 17-25 s, file cached"

[[model]]
file = "OxCoder-9B.i1-Q6_K.gguf"
id = "oxcoder-9b"
aliases = ["oxcoder", "oxcoder-9b", "agent"]
role = "agent-long-context"
summary = "Long-context agent model: OxCoder-9B, a Qwen3.5-9B fine-tune trained on coding-agent traces. Fully GPU resident (7.4 GB Q6_K with n-gram speculation, no MTP head): about 57 tok/s and a 229K context. Passed 22/22 multi-step tool tasks, including a 70K-token session; coding equal to the 9B (19/48)."
enabled = true
tool_calling = "good"
# Measured against the 9B on the same tasks (session 13): agent tool tasks 22/22 vs 19/22
# (the 9B's misses were empty final answers), coding 19/48 for both, reasoning set 2/8 vs 3/8
# (every miss on both was the token budget running out). So the 9B's ceilings, with system_ops
# one step higher for the tool-use result.

[model.capability]
general = 2.1
coding = 2.0
research = 1.9
medical = 1.0
writing = 2.1
system_ops = 2.1

[model.measured]
gen_tps = 57.0
gen_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 13 (2026-09-28), ngram-mod, contexts 131072-262144, prose 56.7-57.3 tok/s over five loads"
load_s = 6.2
load_s_source = "C:/AI/Logs/overnight-tuning-log.md, session 13 (2026-09-28), median of 5 loads, 6-8 s, file cached"

[[model]]
file = "Ternary-Bonsai-2-27B-PTQ1_0.gguf"
id = "bonsai-27b"
aliases = ["bonsai", "bonsai-27b"]
role = "experimental"
summary = "UNTESTED. PrismML's ternary (1.75-bit) compression of Qwen3.8-27B, 5.95 GB, run by PrismML's own llama.cpp build (Tools/llama-prism, set by serverBinary in models.json). 147K context (0.8 GB VRAM spare, recall verified at 85% full), about 51 tok/s, medium reasoning effort. Not abliterated."
enabled = true
tool_calling = "good"
# Placeholder ceilings copied from the 2-bit Huihui until the overnight tests run. It is in
# config/local.toml auto_exclude, so Switchboard loads it only when a request names it.

[model.capability]
general = 2.5
coding = 2.2
research = 2.4
medical = 1.5
writing = 2.4
system_ops = 2.3

[[model]]
file = "Huihui-Qwen3.8-27B-abliterated-UD-IQ2_S-MTP.gguf"
id = "huihui-27b-iq2"
aliases = ["huihui-iq2", "huihui-2bit", "27b-long", "deep-long"]
role = "deep-reasoning-long-context"
summary = "Smaller 2-bit copy of the Huihui 27B (8.8 GB UD-IQ2_S with an MTP head plus n-gram speculation): a 57K context instead of 24K and faster, about 56 tok/s, but weaker at hard coding (35/48 vs 42/48 for the IQ3_XXS file). For when the 27B needs more room."
enabled = true
tool_calling = "good"
# Measured against the IQ3_XXS file on the same tasks (sessions 10-13): coding 35/48 vs 42/48
# at medium effort (class design 4/8 vs 8/8, hard 9/16 vs 12/16), reasoning set 7/8 vs 8/8,
# agent tool tasks 18/18 vs 17/18. Coding ceiling 0.3 lower; the rest 0.1 lower for the 2-bit quant.

[model.capability]
general = 2.5
coding = 2.2
research = 2.4
medical = 1.5
writing = 2.4
system_ops = 2.3

[model.measured]
gen_tps = 56.0
gen_tps_source = "C:/AI/Logs/overnight-tuning-log.md, session 13 (2026-09-28), MTP + ngram-mod, contexts 32768-65536, prose 55.8-56.0 tok/s over five loads"
load_s = 7.2
load_s_source = "C:/AI/Logs/overnight-tuning-log.md, session 13 (2026-09-28), 5 loads, all 7.2 s, file cached"
