# Switchboard configuration.
#
# Every value here can be overridden by an environment variable named
# SWITCHBOARD_<SECTION>__<KEY> (double underscore separates nesting), e.g.
#   SWITCHBOARD_ROUTING__MODE=shadow
#   SWITCHBOARD_SERVER__PORT=8012
# Secrets (TYPESAFE_API_KEY) are read from the environment or .env only.

[server]
host = "127.0.0.1"
port = 8002

[upstream]
# The llama-server that C:\AI\start.ps1 launches. Switchboard never changes how
# it is launched; it sits in front of it.
base_url = "http://127.0.0.1:10000"
connect_timeout_s = 5.0
# Generation on a partially offloaded 27B can legitimately run for many minutes.
request_timeout_s = 900.0
health_ttl_s = 2.0

[stack]
ai_root = 'C:\AI'
models_dir = 'C:\AI\models'
# Read-only: the model list and per-model llama-server parameters the dashboard owns.
models_config = 'C:\AI\Config\models.json'
# The dashboard owns starting/stopping llama-server. Switchboard asks it to switch.
dashboard_url = "http://127.0.0.1:9090"
# Read-only: Lecture Notes rewrites this every 5 s while recording. A missing,
# unreadable or stale (>60 s) file counts as "not recording".
recording_status_file = 'C:\AI\Projects\lecture-notes\state\status.json'

[routing]
# active = switchboard-auto may switch the loaded model through the dashboard.
# shadow = never switch; answer on the resident model and record what it would have done.
# off    = no routing at all; pure pass-through to the resident model.
mode = "active"
# An explicit model name in the request always wins over automatic routing.
allow_explicit_switch = true
# Requests that name no known model fall back to this policy.
default_policy = "auto"
# Model ids Switchboard never switches to on its own (the dashboard's Settings >
# Models ticks). A request can still name one, it can still be loaded by hand,
# and it keeps serving if it is already loaded.
auto_exclude = []

[routing.guards]
# A switch must beat staying put by this much expected utility (in seconds) ...
hysteresis_seconds = 12.0
# ... and must promise at least this much more chance of a good answer.
min_quality_gain = 0.08
# After a switch, hold the new model for at least this long unless a request is
# infeasible on it (context too small) or the user names another model.
min_dwell_seconds = 120.0
# Never restart llama-server while it is generating for anyone (checked via /slots).
never_switch_when_busy = true
# How long a request may wait for a model load before giving up and answering on
# whatever is resident.
max_switch_wait_s = 300.0
# Small non-streaming calls are utility traffic (cptr generates chat titles with
# max_tokens=100 and a 15s client timeout). Never make those wait for a load
# while a usable model is resident.
utility_max_tokens = 160
# block = refuse to auto-switch to a model whose estimated host-RAM footprint does
# not fit; warn = allow it and record the risk in the routing reason.
ram_guard = "warn"
ram_headroom_gb = 1.0
# While a Lecture Notes recording runs (read from its status file, see [stack]),
# Switchboard will not load a model file larger than this. Direct loads from
# the stack dashboard are outside this guard. The 27Bs are configured to fill the
# GPU even when partially offloaded, so loading one mid-lecture could take the
# memory the transcription model needs. Smaller models stay allowed, the loaded
# model is never forced out, and the guard covers automatic, explicit and
# manual switches alike. 9 GB keeps the 9B and holds off both 27Bs.
recording_guard = true
recording_max_model_gb = 9.0

[policy]
# What a better answer is worth, expressed as seconds of extra waiting the user
# would accept for a model that is certain to answer well rather than certain to
# answer badly. Raising it makes Switchboard switch more eagerly. 400s is
# calibrated for this machine, where the strong models are 3-6x slower than the
# fast one: it makes a hard task worth a 22s load plus slower tokens, and leaves
# a routine task on whatever is already loaded.
value_of_quality_s = 400.0
# Steepness of the quality curve around a model's capability ceiling. Higher
# means a task comfortably inside a model's ceiling gets no benefit from a
# bigger model, and a task above it benefits sharply.
capability_slope = 2.5
# How much a second of *generation* counts against a second of model loading.
# A streamed answer starts arriving immediately, so slow generation costs less
# than dead waiting. Non-streaming requests pay the full weight regardless.
generation_wait_weight = 0.35
# Expected answer length by difficulty level (trivial, routine, moderate, hard).
expected_output_tokens = [80, 300, 700, 1200]
# Characters per token, for estimating prompt size without tokenizing.
chars_per_token = 3.6
# Used only when a model has no measured load time: derived from the one real
# measurement on this machine (MedGemma, 16.5 GB, 27.6 s -> ~1.7 s/GB).
default_load_s_per_gb = 1.7
# Conversations keep their model unless the running (not instantaneous) difficulty
# moves. This weights the newest turn in that running estimate.
difficulty_ewma_alpha = 0.5

[decisions]
# Order matters: the first backend that answers wins. Backends not listed are off.
#
# "local" is the official TypeSafe System One Adapter over the resident model;
# "logit" is the experimental first-token-probability backend (off by default,
# see [decisions.logit]). Measured comparisons live in docs/EXPERIMENT-LOGITS.md.
backends = ["jev", "local", "rules"]
# Total budget for the semantic layer per request. Whatever has not answered by
# then loses to the next backend, and ultimately to the rules backend.
#
# 6s, because the budget has to cover a failed cloud attempt *and* a local one
# after it: a Jev auth failure costs ~1.2s here and a local decision 1.3-1.5s
# (p50/p95, 2026-09-23; ~3s on a busier day), and at 4s the local backend was
# being squeezed out by a cloud provider that was already broken. Most requests
# never spend any of this - the fast path answers them in under a millisecond.
budget_ms = 6000
# Identical requests within this window reuse the previous decision.
cache_ttl_s = 300
cache_max_entries = 512

[decisions.jev]
# auto = on when TYPESAFE_API_KEY is set, otherwise reported as unconfigured.
enabled = "auto"
# jev-latest currently resolves to jev-1.13.0. Pin the versioned id once the
# step thresholds have been evaluated against it, so an alias move cannot
# silently shift answers the thresholds were tuned on (docs.typesafe.ai/models).
model = "jev-latest"
# Healthy Jev answers in about a tenth of a second. Two seconds and one retry is
# generous, and the SDK's whole retry sequence is also capped at half of
# decisions.budget_ms, so a failing provider leaves time for the local backend.
timeout_s = 2.0
max_retries = 1
# Consecutive failures before the backend is skipped, and for how long.
breaker_failures = 3
breaker_cooldown_s = 60.0
# Charged per input token: $42 per Btok = $0.042 per Mtok (docs.typesafe.ai/models).
usd_per_input_mtok = 0.042

[decisions.local]
# System One Adapter over the resident llama.cpp model.
enabled = true
timeout_s = 20.0
# Skip when the resident model generates slower than this: on a 5 tok/s 27B a
# structured decision costs more than it saves.
min_resident_gen_tps = 15.0
# Skip when llama-server is already generating: --parallel 1 means we would queue.
skip_when_busy = true
# Ask the adapter for one value per question rather than a probability map: fewer
# tokens, and a local model's stated probabilities are not calibrated anyway.
answer_mode = "discrete"
max_output_tokens = 512

[decisions.logit]
# Experimental: reads first-token probabilities from llama.cpp instead of
# generating JSON. Off because its numbers are a next-token distribution, not
# validated probabilities - often sharply peaked, and nothing shows a stated 0.9
# is right 90% of the time - and the brief allows it only if its probability
# behaviour can be validated. It also measured below the adapter backend (task
# agreement 0.43 vs 0.68, 2026-09-23). See docs/EXPERIMENT-LOGITS.md before
# turning it on.
enabled = false
timeout_s = 15.0
top_logprobs = 20
min_resident_gen_tps = 0.0
skip_when_busy = true

[decisions.rules]
# Deterministic keyword/shape heuristics. Always available, never fails.
enabled = true

[decisions.fast_path]
# Ask the rule engine first and stop there when it is confident the request is
# easy. An easy request stays on the resident model whatever a semantic backend
# would have said, and a semantic backend costs 1.3-2.3s here, so those seconds
# would buy nothing. Everything else goes through the full chain.
enabled = true
max_difficulty = 1.0
min_confidence = 0.5
# Domains that always get the full chain regardless: a wrong domain here means
# the specialist model is never reached, and the keyword lists are weakest on
# clinical language.
always_confirm_domains = ["medical"]

[privacy]
# Redact secrets from anything leaving the process (cloud state and stored previews).
redact = true
# Hard cap on the state sent to a cloud decision provider.
max_state_chars = 1500
# Store a short redacted preview of requests alongside the hash, for debugging.
store_previews = false
preview_chars = 80
# Set false to keep every request on this machine even when a key is configured.
allow_cloud = true

[observability]
db_path = "data/switchboard.sqlite3"
# Keep route rows this long; `switchboard prune` enforces it.
retention_days = 30
