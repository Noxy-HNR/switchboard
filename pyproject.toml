[project]
name = "switchboard"
version = "0.1.0"
description = "Low-latency routing and supervisory layer for the local llama.cpp stack in C:\\AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # Pinned: the System One Adapter requires typesafe-sdk>=0.7.0, whose response
    # types moved from msgspec to pydantic in 0.7.0. Unpinning risks another
    # breaking ser/de change in a very young SDK.
    "typesafe-sdk==0.7.1",
    "system-one-adapter==0.2.1",
    # cptr — the only MCP client on this machine — ships mcp 1.29. Staying on the
    # same major version keeps the protocol negotiation path well-trodden.
    "mcp>=1.29,<2",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
switchboard = "switchboard.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:switchboard.*"]
